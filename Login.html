<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blue Moon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)),
                        url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1920')
                        center/cover fixed no-repeat;
            color: #fff;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-txt {
            font-size: 22px;
            font-weight: bold;
            color: #f97316;
        }

        .menu-links a {
            text-decoration: none;
            color: #fff;
            margin-left: 20px;
            font-size: 15px;
            transition: 0.3s;
        }

        .menu-links a:hover,
        .menu-links a.active {
            color: #f97316;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            background: rgba(30, 30, 30, 0.9);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            color: white;
            border: 1px solid #333;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-box h2 {
            margin-bottom: 10px;
            color: #f97316;
        }

        .login-box p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #f97316;
            background: #333;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ea580c;
            transform: translateY(-2px);
        }

        .links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
            flex-wrap: wrap;
            gap: 10px;
        }
        .links label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .links a {
            color: #f97316;
            text-decoration: none;
            transition: 0.3s;
        }

        .links a:hover {
            text-decoration: underline;
        }
            .menu-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            .menu-links a { margin-left: 0; font-size: 14px; }

            .login-box { padding: 25px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-txt">🍜 Blue Moon</div>
        <div class="menu-links">
            <a href="Intex.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="promotion.html">Promotion</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" class="active">Login/out</a>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>Welcome back!</h2>
            <p>Sign in your account to order food.</p>

            <form action="index.html" method="get">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@gmail.com"
                           autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••"
                           autocomplete="current-password"
                           minlength="6" required>
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            <div class="links">
                <label for="remember">
                    <input type="checkbox" id="remember" name="remember"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
        </div>
    </div>

</body>
</html>
