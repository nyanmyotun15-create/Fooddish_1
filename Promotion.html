<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions - Blue Moon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)),
                        url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1920') center/cover fixed;
            color: white;
            min-height: 100vh;
        }
        .navbar {
           display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 8%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo-txt {
            font-size: 22px;
            font-weight: bold;
            color: #f97316;
        }

        .menu-links a {
            text-decoration: none;
            color: #fff;
            margin-left: 20px;
            font-size: 15px;
            transition: 0.3s;
        }

        .menu-links a:hover,
        .menu-links a.active {
            color: #f97316;
        }
        .area {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .area h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }

        .card {
            background: linear-gradient(135deg, #f97316, #0e7490);
            color: #fff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #fff8dc;
        }

        .card p {
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .card .code {
            background: #0b1a3a;
            color: #f97316;
            display: inline-block;
            padding: 6px 15px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 1px;
        }
            .navbar {
                flex-direction: column;
                gap: 10px;
                padding: 15px 5%;
            }

            .menu-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            .menu-links a {
                margin-left: 0;
                font-size: 14px;
            }

            .card {
                padding: 25px;
            }

            .card h3 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo-txt">🍜 Blue Moon</div>
        <div class="menu-links">
            <a href="home.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="promotion.html" class="active">Promotion</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login/out</a>
        </div>
    </div>

    <div class="area">
        <h2>Special Offers</h2>

        <div class="card">
            <h3>Water Festival Weekend Sale!</h3>
            <p>Get 50% off on Thingyan Festival orders. Offer valid October 22–28.</p>
            <div class="code">CODE: NMT123456</div>
        </div>
    <div class="card">
            <h3>Free Delivery</h3>
            <p>Enjoy free delivery on orders above $1,500.</p>
        </div>
    </div>
</body>
</html>
